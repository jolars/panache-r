version: "3"

tasks:
  default:
    deps: [install]

  document:
    desc: Regenerate roxygen documentation and NAMESPACE
    cmds:
      - Rscript -e 'devtools::document(roclets = c("rd", "collate", "namespace"))'

  extendr-document:
    desc: Regenerate extendr wrappers and package documentation
    cmds:
      - task: extendr-wrappers
      - Rscript -e 'devtools::document()'

  extendr-wrappers:
    desc: Regenerate extendr R wrappers
    internal: true
    dir: src
    cmds:
      - cargo run --locked --bin document --manifest-path=rust/Cargo.toml --target-dir=rust/target

  vendor:
    desc: Vendor Rust dependencies for an offline CRAN build
    cmds:
      - rm -rf src/rust/vendor src/rust/vendor.tar.xz
      - cargo generate-lockfile --manifest-path src/rust/Cargo.toml
      - cargo vendor --locked --manifest-path src/rust/Cargo.toml src/rust/vendor
      - tar -cJ --no-xattrs -f src/rust/vendor.tar.xz -C src/rust vendor
      - rm -rf src/rust/vendor

  build:
    desc: Build the R source package
    deps: [document]
    cmds:
      - R CMD build --no-manual .

  install:
    desc: Install the R package
    cmds:
      - R CMD INSTALL --preclean --no-multiarch --with-keep.source .

  check:
    desc: Check the built R source package
    deps: [build]
    cmds:
      - _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual panache_*.tar.gz

  test-rust:
    desc: Test the Rust bridge
    dir: src/rust
    cmds:
      - cargo test --locked

  rust-fmt:
    desc: Check Rust formatting
    dir: src/rust
    cmds:
      - cargo fmt -- --check

  rust-clippy:
    desc: Run Rust lints
    dir: src/rust
    cmds:
      - cargo clippy --locked --all-targets -- -D warnings

  test:
    desc: Run testthat tests
    cmds:
      - Rscript -e 'devtools::test()'

  clean:
    desc: Remove native build artifacts and unpacked vendor state
    cmds:
      - >-
        rm -rf src/*.o src/*.so src/*.dll src/symbols.rds src/rust/target
        src/rust/vendor src/.cargo src/vendor panache.Rcheck

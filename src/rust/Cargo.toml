[package]
name = "panache-r"
publish = false
version = "0.0.0"
edition = "2024"
rust-version = "1.89.0"

[lib]
crate-type = ["rlib", "staticlib"]
name = "panache"

[[bin]]
name = "document"
path = "document.rs"
bench = false

[dependencies]
extendr-api = { version = "0.9", features = ["result_condition"] }
panache-engine = { package = "panache", version = "=3.12.0", default-features = false }
panache-formatter = "=0.25.0"
panache-parser = "0.30.0"
toml = "1.1"

[profile.release]
lto = true
codegen-units = 1
